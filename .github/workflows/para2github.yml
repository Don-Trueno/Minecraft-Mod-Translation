name: Translation sync

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *' # daily at 02:00 UTC (adjust as needed)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pull-from-paratranz:
    name: Pull translations and commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install requirements
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Pull translations and commit
        env:
          PARA_TOKEN: ${{ secrets.PARA_TOKEN }}
          PARA_PROJECT_ID: ${{ secrets.PARA_PROJECT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/para2github.py
