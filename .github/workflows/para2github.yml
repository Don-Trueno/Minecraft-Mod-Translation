name: ParaTranz To Github

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *' # daily at 02:00 UTC (adjust as needed)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pull-from-paratranz:
    name: Pull translations and commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install requirements
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Pull translations
        env:
          PARA_TOKEN: ${{ secrets.PARA_TOKEN }}
          PARA_PROJECT_ID: ${{ secrets.PARA_PROJECT_ID }}
        run: python .github/scripts/para2github.py

      - name: Commit and Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .
          git commit -m "Update Translations from ParaTranz" && git push || true
